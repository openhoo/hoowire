name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.93.1 --profile minimal --component clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hoowire
          POSTGRES_PASSWORD: hoowire-ci-disposable
          PGPASSWORD: hoowire-ci-disposable
          POSTGRES_DB: hoowire
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -X -w -h 127.0.0.1 -U hoowire -d hoowire -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      HOOWIRE_TEST_DATABASE_URL: postgres://hoowire:hoowire-ci-disposable@127.0.0.1:5432/hoowire
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.93.1 --profile minimal
      - name: Rust tests without PostgreSQL
        run: cargo test --workspace --locked
      - name: PostgreSQL, HTTP, WebSocket and process E2E tests
        run: cargo test --workspace --locked -- --ignored
      - name: Release build
        run: cargo build --release --locked --bin hoowire
